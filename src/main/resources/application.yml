spring:
  application:
    name: personal-finance-analyzer
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:3b

  datasource:
    url: jdbc:h2:mem:financedb
    driver-class-name: org.h2.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false


